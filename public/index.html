<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Reader</title>
<style>
  :root { --bg:#f4f1ea; --ink:#1d1d1b; --card:#fff; --accent:#1f6f4a; --warn:#b3261e; --line:#d9d4c7; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#2b2b2b; font-family:system-ui,"Noto Sans SC",sans-serif; color:var(--ink); }
  .phone { width:390px; max-width:100vw; height:min(844px,100vh); background:var(--bg); border-radius:36px; border:10px solid #111; overflow:hidden; display:flex; flex-direction:column; }
  header { padding:18px 20px 10px; font-size:22px; font-weight:700; }
  main { flex:1; overflow:auto; padding:0 16px 16px; display:flex; flex-direction:column; gap:12px; }
  label { font-size:15px; font-weight:600; }
  textarea { width:100%; min-height:170px; font:inherit; font-size:15px; padding:12px; border:2px solid var(--line); border-radius:14px; resize:vertical; background:var(--card); }
  button { font:inherit; font-size:20px; font-weight:700; padding:16px; border:0; border-radius:16px; background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); border:2px solid var(--accent); font-size:15px; padding:10px; }
  button:disabled { opacity:.5; cursor:wait; }
  .card { background:var(--card); border-radius:16px; padding:16px; border:2px solid var(--line); }
  .summary { font-size:20px; line-height:1.5; }
  .warn { border-color:var(--warn); color:var(--warn); font-weight:600; }
  .tick { font-size:42px; color:var(--accent); line-height:1; }
  .cross { font-size:42px; color:var(--warn); line-height:1; }
  ul { margin:8px 0 0; padding-left:20px; font-size:16px; line-height:1.5; }
  .tag { font-size:12px; text-transform:uppercase; color:#666; margin-right:6px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="phone">
  <header>信件阅读 · Letter Reader</header>
  <main>
    <label for="ocr">Letter text from OCI (simulated)</label>
    <textarea id="ocr" placeholder="Paste OCI-extracted letter text here"></textarea>
    <button class="secondary" id="sample" type="button">Use sample letter</button>
    <button id="go" type="button">Summarise</button>

    <section id="result" class="card" hidden>
      <div id="mark"></div>
      <p id="summary" class="summary"></p>
      <div id="warn" class="card warn" hidden></div>
      <strong>Key details</strong>
      <ul id="details"></ul>
    </section>
  </main>
</div>

<script>
const SAMPLE = `INLAND REVENUE AUTHORITY OF SINGAPORE
Date: 12 March 2026
Our Ref: IR8A-2026-0043217
Dear Mr Tan Ah Kow (NRIC S1234567A),
NOTICE OF ASSESSMENT YEAR OF ASSESSMENT 2026
Your income tax payable is $1,284.50. Please pay by 11 April 2026 to avoid a late payment penalty of 5%.
You may pay via GIRO, PayNow or at any AXS station. If you disagree with the assessment, submit an objection by 11 May 2026.
For enquiries, call 1800 356 8300 (Mon-Fri, 8.30am to 5pm).`;

const $ = (id) => document.getElementById(id);
$("sample").onclick = () => { $("ocr").value = SAMPLE; };

$("go").onclick = async () => {
  const btn = $("go");
  btn.disabled = true; btn.textContent = "…";
  const t0 = performance.now();
  try {
    const res = await fetch("/api/summarise", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text: $("ocr").value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || data.error);
    render(data, performance.now() - t0);
  } catch (e) {
    render({ error: e.message });
  } finally {
    btn.disabled = false; btn.textContent = "Summarise";
  }
};

function render(d, ms) {
  $("result").hidden = false;
  const ok = !d.error;
  $("mark").innerHTML = ok && d.confident ? '<div class="tick">✓</div>' : '<div class="cross">✗</div>';
  $("summary").textContent = ok ? d.summary : "Could not summarise: " + d.error + ". Please try once more.";
  const warn = $("warn");
  const notes = [];
  if (ok && !d.confident) notes.push("I am not fully sure about this letter. Please ask family to check it.");
  if (ok && d.unclear_parts?.length) notes.push("Unclear parts: " + d.unclear_parts.join(" | "));
  warn.hidden = notes.length === 0;
  warn.textContent = notes.join(" ");
  const ul = $("details"); ul.textContent = "";
  for (const k of ok ? d.key_details : []) {
    const li = document.createElement("li");
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = k.type;
    li.append(tag, k.text); ul.append(li);
  }
  if (ms) console.log(`summary in ${(ms / 1000).toFixed(1)}s`);
}
</script>
</body>
</html>
